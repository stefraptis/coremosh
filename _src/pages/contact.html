<!--
path: /contact/
title: Contact
description: Tell Coremosh about your band, your business or your idea: an app, a website, design or analytics.
nav: contact
-->
<section class="page-head">
  <div class="wrap">
    <h1>Contact</h1>
    <p class="lead">Tell us about your band, your business or your idea. We read every message and reply by email.</p>
  </div>
</section>

<section class="section section-first">
  <div class="wrap">
    <form class="form" action="https://formspree.io/f/mbggzeyq" method="POST">
      <div class="field">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Your email <span class="hint">We reply to this address.</span></label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="about">What is it about?</label>
        <select id="about" name="about">
          <option value="app">An app</option>
          <option value="website">A website</option>
          <option value="design">Design: a logo, a cover, a poster</option>
          <option value="analytics">Analytics</option>
          <option value="other" selected>Something else</option>
        </select>
      </div>
      <div class="field">
        <label for="message">Your message <span class="hint">Who you are, what you need, and any links that help.</span></label>
        <textarea id="message" name="message" required></textarea>
      </div>
      <div class="hp" aria-hidden="true">
        <label for="company">Leave this empty</label>
        <input id="company" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
      </div>
      <input type="hidden" name="_subject" value="Message from coremosh.com">
      <button class="btn" type="submit">Send message</button>
      <p class="form-note">Your message goes to us through Formspree. We use your details only to reply, and delete them once the conversation is over. More in <a href="/privacy/">Privacy</a>.</p>
    </form>
  </div>
</section>
<script>
  (function () {
    var about = new URLSearchParams(location.search).get("about");
    var select = document.getElementById("about");
    if (about && select.querySelector('option[value="' + about.replace(/[^a-z]/g, "") + '"]')) select.value = about;
  })();
</script>
